<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App | Astha Ankola</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body data-weather="default">

    <!-- Animated Background -->
    <div class="background"></div>

    <!-- Main Container -->
    <div class="container">

        <!-- Glass Card -->
        <div class="weather-card">

            <!-- ================= HEADER ================= -->
            <header class="header">

                <div class="logo">
                    <i class="fa-solid fa-cloud-sun"></i>
                    <div>
                        <h1>Weather Station</h1>
                        <p class="eyebrow">Live conditions, anywhere</p>
                    </div>
                </div>

                <div class="date-time">
                    <h3 id="date">Saturday, 25 July</h3>
                    <p id="time">10:45 PM</p>
                </div>

            </header>

            <!-- ================= SEARCH ================= -->
            <section class="search-section">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input
                        type="text"
                        id="cityInput"
                        placeholder="Search any city..."
                        autocomplete="off"
                        aria-label="Search for a city">
                    <button id="searchBtn" type="button">
                        <span class="btn-label">Search</span>
                        <i class="fa-solid fa-arrow-right btn-icon"></i>
                    </button>
                </div>
            </section>

            <!-- ================= STATUS ================= -->

            <!-- Skeleton loader -->
            <div class="skeleton" aria-hidden="true">
                <div class="skeleton-icon"></div>
                <div class="skeleton-line skeleton-temp"></div>
                <div class="skeleton-line skeleton-city"></div>
                <div class="skeleton-line skeleton-cond"></div>
            </div>

            <!-- Error Message -->
            <div class="error" role="alert">
                <i class="fa-solid fa-circle-exclamation"></i>
                <div class="error-copy">
                    <strong id="errorTitle">City not found</strong>
                    <span id="errorHint">Check the spelling and try again.</span>
                </div>
            </div>

            <!-- ================= WEATHER ================= -->
            <section class="weather-main">
                <img id="weatherIcon" src="" alt="" />
                <h2 id="temperature">--°C</h2>
                <h3 id="cityName">Search a city</h3>
                <p id="weatherCondition">Type a city above to get started</p>
            </section>

            <!-- ================= DETAILS (GAUGES) ================= -->
            <section class="weather-details">

                <div class="detail-card">
                    <div class="gauge">
                        <svg viewBox="0 0 100 100">
                            <circle class="gauge-bg" cx="50" cy="50" r="42"></circle>
                            <circle class="gauge-fill" id="humidityGauge" cx="50" cy="50" r="42"></circle>
                        </svg>
                        <i class="fa-solid fa-droplet"></i>
                    </div>
                    <h4>Humidity</h4>
                    <p id="humidity">--%</p>
                </div>

                <div class="detail-card">
                    <div class="gauge">
                        <svg viewBox="0 0 100 100">
                            <circle class="gauge-bg" cx="50" cy="50" r="42"></circle>
                            <circle class="gauge-fill" id="windGauge" cx="50" cy="50" r="42"></circle>
                        </svg>
                        <i class="fa-solid fa-wind"></i>
                    </div>
                    <h4>Wind</h4>
                    <p id="wind">-- m/s</p>
                </div>

                <div class="detail-card">
                    <div class="gauge">
                        <svg viewBox="0 0 100 100">
                            <circle class="gauge-bg" cx="50" cy="50" r="42"></circle>
                            <circle class="gauge-fill" id="feelsLikeGauge" cx="50" cy="50" r="42"></circle>
                        </svg>
                        <i class="fa-solid fa-temperature-half"></i>
                    </div>
                    <h4>Feels Like</h4>
                    <p id="feelsLike">--°C</p>
                </div>

                <div class="detail-card">
                    <div class="gauge">
                        <svg viewBox="0 0 100 100">
                            <circle class="gauge-bg" cx="50" cy="50" r="42"></circle>
                            <circle class="gauge-fill" id="pressureGauge" cx="50" cy="50" r="42"></circle>
                        </svg>
                        <i class="fa-solid fa-gauge-high"></i>
                    </div>
                    <h4>Pressure</h4>
                    <p id="pressure">---- hPa</p>
                </div>

            </section>

            <!-- ================= FOOTER ================= -->
            <footer>
                <div class="footer-left">
                    <i class="fa-solid fa-clock"></i>
                    <span id="lastUpdated">Last updated : --</span>
                </div>
                <div class="footer-right">
                    Made with ❤️ by <strong>Astha Ankola</strong>
                </div>
            </footer>

        </div>
    </div>

    <!-- JS -->
    <script src="script.js"></script>

</body>

</html>
